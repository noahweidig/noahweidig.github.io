# Netlify: PR deploy previews only. Production stays on GitHub Pages
# (deployed from `main` via .github/workflows/publish.yml).
[build]
  publish = "dist"
  command = "npm ci && npm run build:fast"

[build.environment]
  NODE_VERSION = "22.22.2"

# ---------------------------------------------------------------------------
# Caching (issue #205, partial).
#
# These rules apply to Netlify deploy previews only. Production is GitHub
# Pages behind Cloudflare, which serves every static asset with the Pages
# default `max-age=14400`; that TTL can't be set from this repo, so the
# production half of #205 is a Cloudflare cache rule with the same path
# patterns below.
#
# Only content-addressed paths get the one-year `immutable` lifetime:
# `_astro/**` is Astro's hash-named bundle and optimized-image output,
# `fonts/**` are pinned woff2 subsets, and `pagefind/**` is the hash-named
# search index. `media/**` keeps a shorter TTL because those filenames are
# stable across deploys.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML is deliberately left alone: Netlify already serves it revalidated per
# deploy, and on production the Pages default (`max-age=600`) is what the
# issue asks for.
