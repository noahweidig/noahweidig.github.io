<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs/loader.js"></script>
<script>
  // The loader above is an AMD/RequireJS-compatible module system: it sets a
  // global `define` with `define.amd` truthy. Every UMD bundle Quarto loads
  // in <head> (quarto-search's autocomplete, bootstrap, tippy, clipboard,
  // headroom...) feature-detects that exact flag and, finding it, registers
  // itself as an anonymous AMD module instead of attaching its usual
  // `window` global -- so e.g. `window["@algolia/autocomplete-js"]` never
  // exists and quarto-search's init throws before it can mark the navbar
  // search icon ready. Those bundles all run as deferred scripts, which fire
  // after this document finishes parsing but before `DOMContentLoaded` --
  // so hide the AMD flag for that whole window and restore it once
  // `DOMContentLoaded` fires (deferred scripts are guaranteed to have run by
  // then), which is late enough for Monaco's own `require(['vs/editor/...'])`
  // chunk loads to still see an AMD loader.
  if (window.define) {
    var qwebrAmdFlag = window.define.amd;
    window.define.amd = false;
    document.addEventListener("DOMContentLoaded", function () {
      window.define.amd = qwebrAmdFlag;
    });
  }
</script>
<script type="module" id="qwebr-monaco-editor-init">

  // Configure the Monaco Editor's loader
  require.config({
    paths: {
      'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs'
    }
  });
</script>
