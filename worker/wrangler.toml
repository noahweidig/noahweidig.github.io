name = "noahweidig-blog-write-oauth"
main = "src/index.ts"
compatibility_date = "2026-09-11"

[vars]
# Public — GitHub OAuth Client IDs are not secret.
GITHUB_CLIENT_ID = "REPLACE_WITH_OAUTH_APP_CLIENT_ID"
ALLOWED_ORIGINS = "https://noahweidig.com,http://localhost:4321"

# GITHUB_CLIENT_SECRET is set with:
#   wrangler secret put GITHUB_CLIENT_SECRET
# Never put it in this file.
