version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 10

    cooldown:
      default-days: 7

    commit-message:
      prefix: "chore"

    labels:
      - dependencies
      - github-actions

    # One PR per week for all action bumps instead of one per action.
    groups:
      actions:
        patterns:
          - "*"

  # The build tooling (puppeteer, pagefind, ...) is pinned in
  # package.json / package-lock.json, so an ecosystem manager can watch it
  # (#249).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    cooldown:
      default-days: 7

    commit-message:
      prefix: "chore"

    labels:
      - dependencies

    # Minor and patch bumps arrive together as one weekly PR; majors stay
    # separate so each gets its own review.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
