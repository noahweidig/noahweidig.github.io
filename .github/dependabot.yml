version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 10

    commit-message:
      prefix: "chore"

    labels:
      - dependencies
      - github-actions

  # The build tooling (puppeteer, axe-core, html-validate) is pinned in
  # package.json / package-lock.json, so an ecosystem manager can watch it
  # (#249). Quarto itself is not covered by any of these — .quarto-version is
  # watched by .github/workflows/quarto-release.yml instead.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    commit-message:
      prefix: "chore"

    labels:
      - dependencies
