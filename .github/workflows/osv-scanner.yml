name: OSV scanner

on:
  pull_request:
    branches: [main]
    paths:
      - 'package-lock.json'
      - 'worker/package-lock.json'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google/osv-scanner-action/osv-scanner-action@6ad84ce1ef2d4124ba333b221894c133c4a970ea # v2.7.0
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=worker/package-lock.json
