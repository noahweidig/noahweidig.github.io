name: Check links (monthly)

# Pull requests get their link check from the `lychee` job in publish.yml,
# which reuses that run's build. This is only the monthly sweep for link rot.
on:
  schedule:
    # The 8th of each month.
    - cron: '0 6 8 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build site
        uses: ./.github/actions/build-site

      - name: Check links
        uses: ./.github/actions/check-links
