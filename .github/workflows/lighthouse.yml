name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lhci:
    runs-on: ubuntu-latest
    # Eight URLs at three runs each (see lighthouserc.js) rather than one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.9.38

      # Responsive image variants are generated by cwebp during the render, so
      # the audited site has to be built with it available (see publish.yml).
      - name: Install cwebp
        continue-on-error: true
        env:
          WEBP_SHA256: f4bf49f85991f50e86a5404d16f15b72a053bb66768ed5cc0f6d042277cc2bb8
        run: |
          curl -sSfL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/libwebp.tar.gz" \
            https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.5.0-linux-x86-64.tar.gz
          echo "$WEBP_SHA256  $RUNNER_TEMP/libwebp.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/libwebp.tar.gz" --strip-components=2 \
            -C "$RUNNER_TEMP" libwebp-1.5.0-linux-x86-64/bin/cwebp
          sudo install -m 0755 "$RUNNER_TEMP/cwebp" /usr/local/bin/cwebp
          cwebp -version

      - name: Render site
        run: quarto render

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.js
          runs: 3
