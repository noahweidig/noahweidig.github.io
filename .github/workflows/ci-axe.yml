name: Accessibility (axe)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same build as publish.yml, so axe audits the bytes that actually ship.
      - name: Build site
        uses: ./.github/actions/build-site

      # Lifecycle scripts stay off during install (SonarCloud flags implicit
      # script execution); puppeteer's postinstall is what fetches its matched
      # Chromium build, so it is re-run explicitly — a script we know we asked
      # for, at the version package-lock.json pins.
      - name: Fetch Chromium for puppeteer
        run: node ./node_modules/puppeteer/install.mjs

      - name: Run axe-core
        run: npm run a11y
