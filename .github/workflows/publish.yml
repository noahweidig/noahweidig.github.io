name: Publish website

on:
  push:
    branches: [main]
  # Render-only check for PRs so a broken site never reaches main.
  pull_request:
    branches: [main]
  # Re-render automatically after the Zotero sync commits new publications.
  # (Pushes made with GITHUB_TOKEN don't fire `push` workflows, so we chain
  # off the update workflow's completion instead.)
#  workflow_run:
#    workflows: ["Update Zotero"]
#    types: [completed]
#    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  # Cancel superseded PR render checks, but never a production deploy: killing
  # a run mid-`deploy-pages` cancels the Pages deployment it is waiting on
  # (that is where the "Deployment cancelled" failures came from), and the
  # queued replacement then inherits a half-finished deployment. Production
  # runs queue instead, so each deployment finishes before the next starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip the chained run if the Zotero sync itself failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run events carry no useful ref; render main. All other
          # events (push, PR, dispatch) check out their default ref.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.9.38

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          # The action's default is 10 minutes, after which it gives up AND
          # cancels the deployment it was polling. Pages holds a deployment in
          # `deployment_in_progress` well past that whenever it is also syncing
          # the custom domain or (re)issuing the domain's TLS certificate — the
          # content is already served by then, so aborting throws away a
          # deployment that had effectively succeeded. 25 minutes covers the
          # domain-sync case; a deployment genuinely stuck still fails, just
          # later. Kept under the job's 30-minute cap so the action reports the
          # timeout itself instead of the runner killing the job.
          timeout: 1500000
