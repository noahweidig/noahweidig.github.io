name: Deploy AI search Worker

# Independent of publish.yml on purpose: a Worker deploy must never be able to
# block the site, and a site deploy must never wait on the Worker. The site
# degrades silently when this endpoint is missing.
on:
  workflow_run:
    # The catalog is curled from the live site, so deploy after it has updated.
    workflows: ['Publish website']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A failed site build means the catalog may be stale or missing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      # Bakes the live /search-index.json into the bundle. The script refuses a
      # catalog of fewer than 50 documents, so a broken index fails here rather
      # than shipping a Worker that answers "not on this site" to everything.
      - name: Bake the catalog
        run: npm run catalog
        working-directory: worker

      - name: Deploy
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
