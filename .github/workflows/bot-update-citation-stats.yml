name: Update citation stats

on:
  schedule:
    # Weekly: attention/citation counts don't move fast enough to justify
    # the same cadence as the Zotero sync.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-citation-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Fetch Dimensions & Altmetric stats
        run: node scripts/sync/citation-stats.js

      - name: Commit changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/citation-stats.json
          if git diff --cached --quiet; then
            echo "No citation stats changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Auto-update citation stats"
          for i in 1 2 3 4; do
            if git push; then
              echo "pushed"; exit 0
            fi
            echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
            git pull --rebase || true
          done
          echo "::error::git push failed after retries"; exit 1

  deploy:
    needs: update
    if: needs.update.outputs.committed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
