name: Production audit

# Every other check in this repo runs on a PR, against a build. Nothing has
# ever looked at what visitors actually get: a Cloudflare cache rule, a Pages
# header change, a third-party embed going bad, or a Zotero sync commit are
# all invisible to a PR check (#256). This is the one job that sees
# production.
on:
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://noahweidig.com

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Lighthouse CI against production
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.production.cjs
          runs: 3

  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install toolchain
        run: |
          npm ci --ignore-scripts
          node ./node_modules/puppeteer/install.mjs

      - name: Run axe-core against production
        run: node scripts/axe-audit.mjs --base "$SITE_URL"

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links on production's key pages
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Same accepted codes and exclusions as links.yml, which explains
          # each of them; this one reads the live pages instead of dist.
          #
          # lychee has no recursive crawl, so the pages are listed. The first
          # run of this job passed `--max-depth 2` and died with
          # "error: unexpected argument '--max-depth' found" before checking a
          # single link. Keep this list in step with PAGES in
          # scripts/axe-audit.mjs.
          args: >-
            --no-progress
            --accept '100..=103,200..=299,403,405,415,429,999'
            --exclude 'ecos\.fws\.gov'
            --exclude 'victoriamdonovan\.org'
            --exclude 'original-ufdc\.uflib\.ufl\.edu'
            ${{ env.SITE_URL }}/
            ${{ env.SITE_URL }}/cv/
            ${{ env.SITE_URL }}/experience/
            ${{ env.SITE_URL }}/education/
            ${{ env.SITE_URL }}/projects/
            ${{ env.SITE_URL }}/publications/
            ${{ env.SITE_URL }}/blog/
            ${{ env.SITE_URL }}/contact/
          fail: true

  # A silently dead contact form is the worst failure on this site: the form
  # is the conversion point every page funnels toward, and nothing would
  # notice if the endpoint were removed, disabled, or over quota (#273).
  contact-form:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the form endpoint is still live
        env:
          UA: >-
            Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like
            Gecko) Chrome/140.0.0.0 Safari/537.36
        run: |
          set -euo pipefail
          # Read the endpoint out of the page rather than repeating it here,
          # so this checks the URL visitors actually post to.
          # --proto '=https' on the request and on any redirect it follows:
          # this reads a URL out of the response and then calls it, so a
          # downgrade to plain HTTP anywhere in the chain must fail loudly.
          #
          # /contact/ with the trailing slash: /contact is the legacy
          # public/contact.html stub, whose only content is a meta refresh
          # curl does not follow, so it carries no form for the grep below.
          #
          # A browser User-Agent because the first run of this job got HTTP
          # 403 from Cloudflare here while the same URL served 200 elsewhere.
          action=$(curl -fsSL --proto '=https' --proto-redir '=https' \
            -A "$UA" "$SITE_URL/contact/" \
            | grep -o 'action="https://formspree.io/f/[^"]*"' \
            | head -1 | cut -d'"' -f2)
          if [ -z "$action" ]; then
            echo "::error::No Formspree action found on $SITE_URL/contact/"
            exit 1
          fi
          echo "Endpoint: $action"
          # A CORS preflight: it exercises the real endpoint and tells a live
          # form apart from a deleted or disabled one, without delivering a
          # test message to the inbox on every scheduled run.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
            --proto '=https' --proto-redir '=https' -A "$UA" "$action" \
            -H "Origin: $SITE_URL" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type")
          echo "Preflight: HTTP $code"
          case "$code" in
            200|204) ;;
            *) echo "::error::Formspree endpoint returned HTTP $code"; exit 1 ;;
          esac
