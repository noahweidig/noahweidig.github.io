name: Production audit

# Every other check in this repo runs on a PR, against a build. Nothing has
# ever looked at what visitors actually get: a Cloudflare cache rule, a Pages
# header change, a third-party embed going bad, or a Zotero sync commit are
# all invisible to a PR check (#256). This is the one job that sees
# production.
on:
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://noahweidig.com

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Lighthouse CI against production
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.production.cjs
          runs: 3
          # The action ignores `upload` in the config file and takes its own
          # inputs, both of which default to false — so the first three failing
          # runs reported category scores with no way to see which audits were
          # behind them. Diagnosing the 2026-09-07 run meant reconstructing the
          # scores from Lighthouse's category weights by hand. The reports are
          # attached to the run instead of pushed to Lighthouse's public
          # storage: this is a scheduled job on a personal site, and a run
          # artifact is private to the repository.
          uploadArtifacts: true

  axe:
    runs-on: ubuntu-latest
    # Worst case is every page blocked and retried twice with widening gaps;
    # see RETRY_DELAYS_MS in scripts/axe-audit.mjs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install toolchain
        run: |
          npm ci --ignore-scripts
          node ./node_modules/puppeteer/install.mjs

      - name: Run axe-core against production
        env:
          # Set both to send a header a Cloudflare WAF skip rule can match
          # (#95). Unset, nothing extra is sent and the run is unchanged.
          AUDIT_BYPASS_HEADER: ${{ secrets.AUDIT_BYPASS_HEADER }}
          AUDIT_BYPASS_TOKEN: ${{ secrets.AUDIT_BYPASS_TOKEN }}
        run: node scripts/axe-audit.mjs --base "$SITE_URL"

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links on production's key pages
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Same accepted codes and exclusions as links.yml, which explains
          # each of them; this one reads the live pages instead of dist.
          #
          # /cdn-cgi/l/email-protection is excluded on top of those: Cloudflare
          # rewrites every mailto: on the site into one of those links and
          # decodes it in the browser with JavaScript. Fetched directly it is a
          # 404 by design, which is 11 of the 11 errors the second run reported
          # across 8 pages. Nothing there is a broken link; the mailto: they
          # come from is in the source and never reaches lychee.
          #
          # lychee has no recursive crawl, so the pages are listed. The first
          # run of this job passed `--max-depth 2` and died with
          # "error: unexpected argument '--max-depth' found" before checking a
          # single link. Keep this list in step with PAGES in
          # scripts/axe-audit.mjs.
          args: >-
            --no-progress
            --accept '100..=103,200..=299,403,405,415,429,999'
            --exclude 'ecos\.fws\.gov'
            --exclude 'victoriamdonovan\.org'
            --exclude 'original-ufdc\.uflib\.ufl\.edu'
            --exclude 'noahweidig\.com/cdn-cgi/'
            ${{ env.SITE_URL }}/
            ${{ env.SITE_URL }}/cv/
            ${{ env.SITE_URL }}/experience/
            ${{ env.SITE_URL }}/education/
            ${{ env.SITE_URL }}/projects/
            ${{ env.SITE_URL }}/publications/
            ${{ env.SITE_URL }}/blog/
            ${{ env.SITE_URL }}/contact/
          fail: true

  # A silently dead contact form is the worst failure on this site: the form
  # is the conversion point every page funnels toward, and nothing would
  # notice if the endpoint were removed, disabled, or over quota (#273).
  contact-form:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install toolchain
        run: |
          npm ci --ignore-scripts
          node ./node_modules/puppeteer/install.mjs

      - name: Check the form endpoint is still live
        env:
          # Set both to send a header a Cloudflare WAF skip rule can match
          # (#95). Unset, nothing extra is sent and the run is unchanged.
          AUDIT_BYPASS_HEADER: ${{ secrets.AUDIT_BYPASS_HEADER }}
          AUDIT_BYPASS_TOKEN: ${{ secrets.AUDIT_BYPASS_TOKEN }}
        run: node scripts/check-contact-form.mjs --base "$SITE_URL"
