name: Quarto release check

# No package manager watches Quarto, so a stale pin can sit for a year with
# no signal (#249). This opens an issue when .quarto-version falls behind the
# latest Quarto release.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the pin against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .quarto-version)"
          latest="$(gh release view --repo quarto-dev/quarto-cli --json tagName --jq '.tagName' | sed 's/^v//')"
          echo "pinned=$pinned latest=$latest"
          if [ "$pinned" = "$latest" ]; then
            echo "Up to date."
            exit 0
          fi

          title="Quarto $latest is out (pinned: $pinned)"
          if [ -n "$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            echo "Issue already open."
            exit 0
          fi
          cat > body.md <<EOF
          \`.quarto-version\` pins **$pinned**; quarto-cli's latest release is **$latest**.

          To bump: edit \`.quarto-version\`, then update \`QUARTO_VERSION\` and \`QUARTO_SHA256\` in \`netlify.toml\` from that release's \`quarto-$latest-checksums.txt\`. \`scripts/check-quarto-pin.sh\` (run by the \`quarto-pin\` job in \`publish.yml\`) fails until the two agree.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          gh issue create --repo "$REPO" --title "$title" --label dependencies --body-file body.md
