name: Refresh publication images

on:
  schedule:
    # 05:00 UTC every Monday, after the project job.
    - cron: '0 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/generate-publication-shots.mjs'
      - '.github/workflows/publication-shots.yml'
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Space-separated publication slugs to refresh (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: publication-shots
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build needed: the script talks to the live sites, not to dist/.
      - name: Install toolchain
        uses: ./.github/actions/build-site
        with:
          build: 'false'


      # The install skips lifecycle scripts, so Puppeteer has no browser yet.
      # It is used only to read og:image from pages that refuse a plain fetch.
      - name: Install Chrome for Puppeteer
        run: npm exec --no --ignore-scripts -- puppeteer browsers install chrome

      # Through env, not string interpolation, so the dispatch input can't
      # become shell. Only slug-shaped words survive.
      - name: Capture images
        env:
          SLUGS: ${{ inputs.slugs }}
        run: |
          set -euo pipefail
          clean=$(printf '%s' "${SLUGS:-}" | tr -cd 'a-z0-9 -')
          node scripts/generate-publication-shots.mjs $clean

      - name: Commit screenshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/albums/publications src/data/publication-images.json
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Refresh publication images from live sites"
          for i in 1 2 3 4; do
            if git push; then
              echo "pushed"; exit 0
            fi
            echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
            git pull --rebase || true
          done
          echo "::error::git push failed after retries"; exit 1
