name: Accessibility (axe)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.9.38

      - name: Render site
        run: quarto render

      - name: Serve site
        run: npx --yes serve -l 4173 _site &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:4173/index.html

      - name: Run axe-core
        run: |
          npx --yes @axe-core/cli \
            http://localhost:4173/index.html \
            http://localhost:4173/cv.html \
            http://localhost:4173/experience/index.html \
            http://localhost:4173/education/index.html \
            http://localhost:4173/projects/index.html \
            http://localhost:4173/publications/index.html \
            http://localhost:4173/blog/index.html \
            http://localhost:4173/contact.html \
            --chrome-options=no-sandbox \
            --exit
