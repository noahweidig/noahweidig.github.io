# SonarCloud analysis scope.
#
# This project uses SonarCloud's Automatic Analysis, which reads its
# configuration from `.sonarcloud.properties` — a `sonar-project.properties`
# file is only picked up by the CI-based scanner and is ignored here.
#
# Everything under _extensions/ is third-party Quarto extension code vendored
# verbatim (quarto-webr, code-window, social-share). It is upstream's to lint,
# and patching it locally would be undone by the next extension update, so it
# is excluded from analysis rather than reported against this project's
# quality gate.
sonar.exclusions=_extensions/**
